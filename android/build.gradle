android {
    namespace = "com.vpjardim.colorbeans"
    compileSdk = 36

    // The AndroidKeys env var holds the path of the folder with AndroidKey.properties and the
    // keystore. It's only needed to sign release builds, so other builds work without it
    def keyPropFile = file("${System.env.AndroidKeys}/AndroidKey.properties")
    if (System.env.AndroidKeys && keyPropFile.exists()) {
        def keyProp = new Properties()
        keyPropFile.withInputStream { keyProp.load(it) }

        signingConfigs {
            AndroidKey {
                storeFile = file("${System.env.AndroidKeys}/${keyProp['storeFile']}")
                storePassword = keyProp["storePassword"]
                keyAlias = keyProp["keyAlias"]
                keyPassword = keyProp["keyPassword"]
            }
        }
    }

    sourceSets {
        main {
            manifest.srcFile("AndroidManifest.xml")
            java.srcDirs = ["src"]
            aidl.srcDirs = ["src"]
            renderscript.srcDirs = ["src"]
            res.srcDirs = ["res"]
            assets.srcDirs = ["../assets"]
            jniLibs.srcDirs = ["libs"]
        }
    }

    packaging {
        resources {
            excludes += ["META-INF/robovm/ios/robovm.xml", "**/*.gwt.xml"]
        }
    }

    defaultConfig {
        applicationId = "com.gmail.vpjardimdev.colorbeans"
        minSdk = 21
        targetSdk = 36
        versionCode = 12
        versionName = "0.1.10"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// called every time gradle gets executed, takes the native dependencies of
// the natives configuration, and extracts them to the proper libs/ folders
// so they get packed with the APK.
tasks.register('copyAndroidNatives') {
    doFirst {
        file("libs/armeabi-v7a/").mkdirs()
        file("libs/arm64-v8a/").mkdirs()
        file("libs/x86_64/").mkdirs()
        file("libs/x86/").mkdirs()

        configurations.natives.copy().files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith("natives-arm64-v8a.jar")) outputDir = file("libs/arm64-v8a")
            if (jar.name.endsWith("natives-armeabi-v7a.jar")) outputDir = file("libs/armeabi-v7a")
            if (jar.name.endsWith("natives-x86_64.jar")) outputDir = file("libs/x86_64")
            if (jar.name.endsWith("natives-x86.jar")) outputDir = file("libs/x86")
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") }.configureEach { packageTask ->
    packageTask.dependsOn "copyAndroidNatives"
}

tasks.register('run', Exec) {
    def path
    def localProperties = project.file("../local.properties")
    if (localProperties.exists()) {
        Properties properties = new Properties()
        localProperties.withInputStream { instr ->
            properties.load(instr)
        }
        def sdkDir = properties.getProperty("sdk.dir")
        if (sdkDir) {
            path = sdkDir
        } else {
            path = "$System.env.ANDROID_HOME"
        }
    } else {
        path = "$System.env.ANDROID_HOME"
    }

    def adb = path + "/platform-tools/adb"
    commandLine "$adb", "shell", "am", "start", "-n", "com.gmail.vpjardimdev.colorbeans/com.vpjardim.colorbeans.AndroidLauncher"
}

eclipse.project.name = appName + "-android"
