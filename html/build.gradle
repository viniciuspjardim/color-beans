// GWT output, the web page and the preloaded assets all go here. superDev serves it on port 8080
def distDir = "build/dist"

gwt {
    gwtVersion = project.gwtVersion
    maxHeapSize = "2G" // Default 256m is not enough for gwt compiler. GWT is HUNGRY
    minHeapSize = "1G"

    modules = ["com.vpjardim.colorbeans.GdxDefinition"]
    war = file(distDir)

    compiler {
        strict = true
        // The line bellow makes the code to not be minified. Useful for debugging only.
        // style = "DETAILED"
    }

    devMode {
        port = 8080
        startupUrl = "http://localhost:8080/index.html"
        modules = ["com.vpjardim.colorbeans.GdxDefinitionSuperdev"]
    }
}

// GWT compiles from sources, so it needs core's sources and module file (G.gwt.xml)
gwt.extraSourceDirs.from(
        file("src/"),
        files(project(":core").sourceSets.main.allJava.srcDirs)
)

// war/ holds the assets the libGDX preloader copies during compilation. Clean it so deleted
// assets don't linger
clean.delete += [file("war")]

tasks.register("distGWT") {
    dependsOn "clean", "gwtCompile"
    doLast {
        copy {
            from "webapp"
            into distDir
        }
        copy {
            from "war"
            into distDir
        }
    }
}

tasks.matching { it.name in ["processResources", "compileJava", "gwtCompile"] }.configureEach {
    mustRunAfter "clean"
}

// Opens GWT's dev mode window and serves the game on http://localhost:8080. Refreshing the
// page recompiles changed sources
tasks.register("superDev") {
    dependsOn "distGWT", "gwtDevMode"
}

tasks.named("gwtDevMode") { mustRunAfter "distGWT" }

java.sourceCompatibility = JavaVersion.VERSION_1_8
java.targetCompatibility = JavaVersion.VERSION_1_8
sourceSets.main.java.srcDirs = ["src/"]

eclipse.project.name = appName + "-html"
